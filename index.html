<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>LCD Custom Character Generator - Mejorado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>LCD Character Generator</h1>
        <p>Haz clic en los píxeles para encender/apagar. Edita hasta 8 caracteres simultáneamente.</p>

        <div id="lcd-grid">
            <!-- Generado por JavaScript -->
        </div>

        <div class="controls">
            <button id="clearAll">Limpiar todo</button>
            <button id="invertAll">Invertir todo</button>
            <button id="resetAll">Resetear todo</button>
        </div>

        <div class="preview">
            <h3>Vista previa en LCD</h3>
            <div id="lcd-preview"></div>
        </div>

        <div class="code-output">
            <h3>Código Arduino generado</h3>
            <pre><code id="arduino-code"></code></pre>
            <button id="copyCode">Copiar código</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
